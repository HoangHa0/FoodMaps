name: Deploy backend

# Pushes backend/ to the Hugging Face Space that runs the API (docs/DEPLOY.md), after CI passed on main.
# The Space rebuilds its Docker image by itself when it receives a new commit. When backend/ did not
# change, `git subtree split` gives the same commit as last time, the push is a no-op and nothing rebuilds.
#
# Setup (once, in GitHub: Settings → Secrets and variables → Actions):
#   secret   HF_TOKEN  a Hugging Face access token with WRITE permission
#   variable HF_SPACE  the Space id, e.g. "your-hf-name/foodmaps-api"
# Without them the job is skipped, so forks and other branches are unaffected.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # "Run workflow" button: deploy main by hand

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  push-to-space:
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # git subtree needs the history

      - name: Split backend/ into its own branch
        run: git subtree split --prefix=backend -b space

      - name: Push to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::secret HF_TOKEN is missing"; exit 1; fi
          owner="${HF_SPACE%%/*}"
          git push --force "https://${owner}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space:main
