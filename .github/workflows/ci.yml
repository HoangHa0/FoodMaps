name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Main checks on Linux: same OS as production, and the only runner type that supports
  # `services:` containers (used here for a real PostgreSQL database).
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          {
            POSTGRES_USER: foodmaps,
            POSTGRES_PASSWORD: foodmaps,
            POSTGRES_DB: foodmaps,
          }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U foodmaps" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://foodmaps:foodmaps@localhost:5433/foodmaps
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Install pgvector into the database container
        working-directory: .
        run: |
          id=$(docker ps -q --filter "ancestor=postgis/postgis:16-3.5")
          docker exec "$id" bash -c "apt-get update -q || { sed -i 's|apt.postgresql.org|apt-archive.postgresql.org|g' /etc/apt/sources.list.d/pgdg.* && apt-get update -q; } && apt-get install -y -q postgresql-16-pgvector"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Exactly one migration head
        run: uv run python scripts/check_migrations.py
      - name: Migrations apply from scratch and match the models
        run: uv run alembic upgrade head && uv run alembic check
      - name: Tests
        run: uv run pytest -m "not todo"
      - name: Frontend API types are up to date
        run: |
          uv run python scripts/export_openapi.py /tmp/openapi.json
          diff -q /tmp/openapi.json ../frontend/openapi.json \
            || (echo "::error::openapi.json is stale. Run 'make api-types' and commit the result." && exit 1)

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # The whole team develops on Windows with Git Bash + make. This job runs the same workflow
  # there to catch Windows-only problems (paths, encodings, line endings) before a teammate does.
  # No database: GitHub's Windows runners do not support `services:` containers.
  windows:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - name: Install GNU make
        run: choco install make --no-progress -y
      - run: make help
      - run: make setup
      - run: make lint
      - name: Tests (no database)
        run: cd backend && uv run pytest -m "not todo and not db"
      - run: cd backend && uv run python scripts/check_migrations.py
      - name: OpenAPI export is byte-identical on Windows
        run: |
          cd backend && uv run python scripts/export_openapi.py "$RUNNER_TEMP/openapi.json"
          diff -q "$RUNNER_TEMP/openapi.json" ../frontend/openapi.json
