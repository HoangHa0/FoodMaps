[project]
name = "foodmaps-backend"
version = "0.1.0"
description = "FoodMaps API (FastAPI) — AI Match, Group Session, Journey"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",        # Vector column type for SQLAlchemy (lightweight, no torch)
    "geoalchemy2>=0.15",    # Geography column type for PostGIS
    "pyjwt>=2.8",           # M1: JWT
    "bcrypt>=4.1",          # M1: password hashing
    "httpx>=0.27",          # Google Places API calls (M7) + test client
]

[project.optional-dependencies]
# Heavy (pulls in torch, several GB). Only needed to work on the AI pipeline: `uv sync --extra ai`.
# Without it, AI Match falls back to the stub provider (see app/shared/contracts.py).
ai = [
    "sentence-transformers>=3.0",
    "google-genai>=1.0",
]

[tool.uv]
package = false  # the app runs from the backend/ directory; no wheel is built

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["I001", "E501"]  # autogenerated files

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
markers = [
    "db: needs a real PostgreSQL database",
    "todo: specification for unimplemented code; skipped in CI, remove the marker once implemented",
]
